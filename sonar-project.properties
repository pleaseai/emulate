sonar.projectKey=pleaseai_emulate
sonar.organization=pleaseai
sonar.projectName=emulate

sonar.sources=packages
sonar.exclusions=**/dist/**,**/node_modules/**,**/__tests__/**
sonar.tests=packages
sonar.test.inclusions=**/__tests__/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8

# Hand-authored static OpenAPI spec objects are data, not logic - exclude from coverage.
# CLI wiring (commander setup, console/process.exit command flow) is exercised
# end-to-end via the running CLI, not unit-tested - exclude from coverage too.
sonar.coverage.exclusions=**/src/routes/openapi.ts,packages/emulate/src/index.ts,packages/emulate/src/commands/**
