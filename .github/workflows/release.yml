name: Release

on:
  push:
    branches: [main]

# Least-privilege by default; jobs opt into the scopes they need.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Maintains the release PR and, when it is merged, tags + creates the
  # GitHub releases for every package whose changelog changed.
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Builds and publishes only the packages that were just released to npm.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Loads mise.release.toml (node 24, whose bundled npm >= 11.5.1 supports
      # Trusted Publishing) on top of mise.toml, locked by mise.release.lock
      MISE_ENV: release
    permissions:
      contents: read
      # OIDC token for npm Trusted Publishing — no NPM_TOKEN needed. npm also
      # generates a provenance attestation automatically on trusted publishes.
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Installs the tool versions pinned in mise.toml and mise.release.toml
      # (bun + node, which provides the npm CLI used to publish). No tool
      # cache: this job publishes to npm, so a poisoned cache entry could end
      # up in the published packages.
      - uses: jdx/mise-action@v5.2.1
        with:
          cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # On Bun 1.4.3 (pinned in mise.toml), `bun pm pack` takes the version it
      # writes for a `workspace:*` dep from the workspace entry in bun.lock, not
      # from that package's package.json. release-please bumps package.json
      # only, and `--frozen-lockfile` does not flag the drift, so the lock still
      # carries the previous versions. That shipped @pleaseai/emulate@0.4.0
      # pinned to 0.3.1/0.3.0 deps, two of which were never published. A
      # non-frozen install rewrites only those version entries.
      - name: Sync workspace versions into bun.lock
        run: bun install

      - name: Build
        run: bun run build

      - name: Pack and verify released packages
        # bash runs with -e and pipefail, so a failed jq, tar or pack fails the
        # step instead of packing nothing
        shell: bash
        env:
          # release-please emits the dirs it released as a JSON array, e.g.
          # ["packages/asana","packages/emulate"].
          PATHS_RELEASED: ${{ needs.release-please.outputs.paths_released }}
        run: |
          pkgs="$(echo "$PATHS_RELEASED" | jq -r '.[]')"
          # name -> version of every workspace package, from package.json
          versions="$(jq -n '[inputs | {(.name): .version}] | add' packages/*/package.json)"
          : > "$RUNNER_TEMP/tarballs"
          failed=0
          while read -r pkg; do
            [ -n "$pkg" ] || continue
            # `bun pm pack` rewrites `workspace:*` deps to the concrete version
            # in the tarball (npm pack/publish on its own would not).
            tarball="$(cd "$pkg" && bun pm pack --quiet)"
            # Every in-repo dep in the packed manifest must equal the version in
            # that package's package.json. All tarballs are checked before the
            # publish step runs, so a mismatch publishes nothing.
            mismatches="$(tar -xOzf "$pkg/$tarball" package/package.json | jq -r --argjson want "$versions" '
              [.dependencies, .optionalDependencies] | add // {} | to_entries[]
              | select(.key | in($want))
              | select((.value | ltrimstr("^") | ltrimstr("~")) != $want[.key])
              | "\(.key): packed \(.value), package.json \($want[.key])"')"
            if [ -n "$mismatches" ]; then
              echo "::error::$pkg/$tarball pins workspace deps that differ from their package.json versions"
              echo "$mismatches"
              failed=1
            fi
            echo "$pkg/$tarball" >> "$RUNNER_TEMP/tarballs"
          done <<< "$pkgs"
          exit "$failed"

      - name: Publish released packages
        shell: bash
        run: |
          while read -r tarball; do
            echo "::group::publish $tarball"
            # npm authenticates via OIDC (Trusted Publisher configured on
            # npmjs.com) and attaches provenance automatically.
            npm publish "$tarball" --access public
            echo "::endgroup::"
          done < "$RUNNER_TEMP/tarballs"
