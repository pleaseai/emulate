name: Docs

on:
  push:
    branches: [main]
    paths: ['website/**', 'skills/**', 'docs/**']
  pull_request:
    paths: ['website/**', 'skills/**', 'docs/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      - run: bun install --frozen-lockfile
      - run: bun scripts/sync-services.ts
      - name: Check generated service pages are up to date
        run: |
          git diff --exit-code -- src/content/docs/services \
            || { echo "::error::services/*.md is stale — run 'bun run sync:services' in website/ and commit"; exit 1; }
      - run: bun run build
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          command: pages deploy dist --project-name=emulate-docs
