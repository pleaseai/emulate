name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          # Full history for accurate SonarQube blame/new-code detection
          fetch-depth: 0

      # Fails when a `uses:` ref has no entry in .github/workflows/actions.lock
      - name: Verify workflow lockfile coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.2.0
          gh actions-lock --verify-local

      # Installs the tool versions pinned in mise.toml (bun, node)
      - uses: jdx/mise-action@v4.2.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run type-check

      - name: Test (with coverage)
        run: bun run test:coverage

      - name: Build
        run: bun run build

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: SonarQube scan
        # Skipped until the SONAR_TOKEN secret is configured
        # (secrets aren't readable in step `if`, so check via env)
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_HOST_URL: https://sonarcloud.io

  jactionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      # Lints the whole repository from its root (workflows, dependabot.yml,
      # actions.lock) with .github/jactionlint.yaml
      - uses: jdx/jactionlint@v2.2.0
